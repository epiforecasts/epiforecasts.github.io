project:
  type: website

website:
  title: "epiforecasts"
  site-url: https://epiforecasts.io
  repo-url: https://github.com/epiforecasts/epiforecasts.github.io
  body-header: '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.7.0/css/academicons.min.css" integrity="sha512-GGGNUPDhnG8LEAEDsjqYIQns+Gu8RBs4j5XGlxl7UfRaZBhCCm5jenJkeJL8uPuOXGqgl8/H1gjlWQDRjd3cUQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />'
  body-footer: '<script data-goatcounter="https://epiforecasts.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>'
  twitter-card: 
    site: "@epiforecasts"
  repo-actions: [edit, source]
  description: "epiforecasts team website"
  navbar:
    left:
      - text: "People"
        href: people.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Software"
        menu:
          - text: '<img src="/images/r-logo.svg" class="nav-lang-icon" alt=""> R packages'
            href: software.qmd
          - text: '<img src="/images/julia-logo.svg" class="nav-lang-icon" alt=""> Julia packages'
            href: julia.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Community"
        href: community.qmd
      - text: "Publications"
        href: pubs.qmd
      - text: "Join us"
        href: positions.qmd
    right:
      - icon: github
        href: https://github.com/epiforecasts/
  page-footer:
    left:
      - text: "CMMID"
        href: https://cmmid.lshtm.ac.uk/
      - text: "LSHTM"
        href: https://www.lshtm.ac.uk/
      - text: "Group manual"
        href: group-manual.qmd
    right:
      - icon: envelope
        href: /positions.qmd#contact
        aria-label: Contact
      - icon: github
        href: https://github.com/epiforecasts/
        aria-label: GitHub
      - icon: bluesky
        href: https://bsky.app/profile/epiforecasts.io
        aria-label: Bluesky

format:
  html:
    theme:
      light: [flatly, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    include-in-header: _fonts.html
    link-external-icon: true
    link-external-newwindow: true
