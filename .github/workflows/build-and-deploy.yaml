# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
  push:
    # stats-data carries the weekly metrics the software page reads. A push
    # there is made by the App rather than by GITHUB_TOKEN, so it does
    # trigger this build and the figures refresh without anyone acting.
    branches: [main, master, stats-data]
  pull_request:
    branches: [main, master]
  schedule:
    - cron:  '0 5 1 * *'

name: build-and-deploy

# One deployment at a time. Two triggers can now overlap -- a metrics push to
# stats-data and a change to main -- and both build from main, so whichever
# finishes last wins. Without this, a run that started before a site change
# can publish its older tree over the newer one. In-progress runs are left to
# finish rather than cancelled, so a deployment is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - uses: actions/checkout@v7
        with:
          # A push to stats-data must still build the site from main: that
          # branch carries a snapshot of the tree as it stood when the data
          # job branched, and deploying it would publish stale pages. The
          # metrics themselves are fetched over HTTP at render time, so
          # building main picks them up.
          ref: ${{ github.ref_name == 'stats-data' && 'main' || '' }}

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: true
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Render site
        run: quarto render
      
      - run: cp -r slides _site

      - run: cp -r _redirects/. _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
